# The converter, run per upload instead of run continuously.
#
# OpenCascade is 221 MB installed, so the conversion cannot live inside a
# serverless function next to the web application -- Vercel's bundle limit is
# 250 MB and the geometry kernel alone does not fit. The remaining options are
# a container host or a CI runner, and this repository is public, so Actions
# minutes are free and unmetered and no further hosting is needed.
#
# This is a bridge, not a destination: Actions is a CI system, not a job queue.
# Moving the worker to a container host later changes this file and nothing
# else, because the queue itself does not care where its workers run.
name: convert

on:
  # Sent by the web application once an upload has landed in storage.
  repository_dispatch:
    types: [convert]
  # And by hand, for a queue that needs draining without a new upload.
  workflow_dispatch:

# One run at a time. A run drains the whole queue rather than taking a single
# job, so a second run waiting behind the first will convert whatever arrived
# in the meantime -- five uploads in a minute do not need five runners.
concurrency:
  group: convert
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: converter/pyproject.toml

      - name: Install the converter
        working-directory: converter
        run: pip install -e ".[cad]"

      - name: Convert everything queued
        working-directory: converter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
        run: python -m app.worker --drain
